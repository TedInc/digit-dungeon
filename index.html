<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Digit Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2dca8; --card:#fff4d6; --ink:#2b2240; --ink-soft:#6a5a86;
  --btn:#fff4d6; --edge:#2b2240; --shadow:#2b2240;
  --gold:#ffc83d; --gold-deep:#c98a12; --coral:#ff6464; --mint:#3fbf74; --sky:#4f8cf0; --plum:#3a2d5c;
  --primary:#4f8cf0; --primary-ink:#ffffff;
  --pixel:"Pixelify Sans",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --read:"Fredoka",ui-rounded,"Avenir Next","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1630; --card:#2f2550; --ink:#fff1d6; --ink-soft:#b9a9dc;
    --btn:#3d3166; --edge:#0f0b1c; --shadow:#0f0b1c; --primary:#5b97f5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1630; --card:#2f2550; --ink:#fff1d6; --ink-soft:#b9a9dc;
  --btn:#3d3166; --edge:#0f0b1c; --shadow:#0f0b1c; --primary:#5b97f5;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  position:fixed;inset:0;margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--read);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
[hidden]{display:none!important}
#app{
  height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));
}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}

/* chunky board-game buttons */
.btn{
  font:inherit;font-family:var(--pixel);font-weight:600;font-size:18px;color:var(--ink);background:var(--btn);
  border:3px solid var(--edge);border-radius:8px;box-shadow:0 4px 0 var(--shadow);
  padding:10px 12px;min-height:48px;cursor:pointer;transition:transform .06s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.gold{background:var(--gold);color:#2b2240}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;min-height:40px}
.btn.small{font-size:15px;min-height:38px;padding:6px 10px}
.btn.num,.btn small{font-family:var(--read)}
.logo,h2,h3{font-family:var(--pixel)}
.lang{display:flex;gap:8px;justify-content:center;margin-top:6px}
.lang .btn{min-height:38px;font-size:15px;padding:4px 14px}
.lang .btn.on{background:var(--gold);color:#2b2240}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.nope{background:var(--coral);color:#fff;opacity:.5;pointer-events:none}
.btn.yes{background:var(--mint);color:#fff}

.card{background:var(--card);border:3px solid var(--edge);border-radius:10px;padding:14px;box-shadow:0 4px 0 var(--shadow)}

/* title */
#scr-title{overflow-y:auto;padding-bottom:12px}
.logo{
  margin:18px 0 0;text-align:center;font-weight:700;font-size:54px;line-height:.95;letter-spacing:1px;
  color:var(--gold);text-shadow:0 3px 0 var(--gold-deep),0 6px 0 var(--plum),3px 6px 0 var(--plum),-3px 6px 0 var(--plum);
}
.tag{text-align:center;margin:4px 0 6px;color:var(--ink-soft);font-size:17px}
.hero-list{display:flex;flex-direction:column;gap:10px}
.hero-row{display:flex;gap:8px;align-items:stretch}
.hero-row .play{flex:1;display:flex;align-items:center;gap:12px;text-align:left}
.hero-row .play img{width:40px;height:40px}
.hero-row .play small{display:block;font-weight:400;color:var(--ink-soft);font-size:14px}
.hero-row .del{width:56px;font-size:14px;padding:4px}
.hero-row .del.armed{background:var(--coral);color:#fff}
label,.label{display:block;font-weight:600;margin:0 0 6px}
input[type=text]{
  font:inherit;font-size:20px;width:100%;padding:10px;border:3px solid var(--edge);border-radius:8px;
  background:var(--bg);color:var(--ink);margin-bottom:12px;-webkit-user-select:text;user-select:text;
}
.seg{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
.seg .btn{text-align:left;font-size:16px}
.seg .btn small{display:block;font-weight:400;font-size:13px;color:inherit;opacity:.8}
.seg .btn.on{background:var(--gold);color:#2b2240}
.row{display:flex;gap:8px}.row>*{flex:1}

/* lobby */
#scr-lobby{gap:8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;min-height:58px;font-size:13px;box-shadow:0 3px 0 var(--shadow)}
.tab img{width:24px;height:24px}
.tab .dots{height:24px;font-size:22px;line-height:24px;letter-spacing:1px}
.tab.on{background:var(--gold);color:#2b2240}
/* items won in the last game: glowing border and a star until tapped */
.tab,.skin{position:relative}
.tab.new,.skin.new{border-color:var(--gold);animation:glow 1.2s ease-in-out infinite alternate}
.tab.new::after,.skin.new::after{
  content:"★";position:absolute;top:-9px;right:-7px;width:22px;height:22px;display:grid;place-items:center;
  font-size:14px;line-height:1;color:#2b2240;background:var(--gold);border:2px solid var(--edge);border-radius:50%;
}
.skin.new img{animation:bob .9s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 4px 0 var(--shadow),0 0 0 2px var(--gold)}to{box-shadow:0 4px 0 var(--shadow),0 0 12px 4px var(--gold)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){.tab.new,.skin.new{animation:none;box-shadow:0 4px 0 var(--shadow),0 0 0 3px var(--gold)}.skin.new img{animation:none}}
.panes{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2px 0 10px}
.pane{display:flex;flex-direction:column;gap:10px}
.lobby-top{display:flex;gap:14px;align-items:center;margin-top:8px}
#lobbyHero{width:96px;height:96px;background:var(--card);border:3px solid var(--edge);border-radius:10px;padding:6px}
.lobby-top h2{margin:0;font-size:30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:13px;color:var(--ink-soft)}
.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;padding:8px 4px;min-height:84px}
.skin img{width:44px;height:44px}
.skin.on{background:var(--gold);color:#2b2240}
.skin.locked{opacity:.55}
.wallet{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:17px}
.wallet img{width:20px;height:20px}.wallet b{font-size:20px}
#lobbyPet{width:52px;height:52px;align-self:flex-end;margin-left:-22px;background:none;border:0;padding:0}
.skin .price{display:flex;align-items:center;gap:3px;font-family:var(--read);font-weight:600}
.skin .price img{width:14px;height:14px}
.skin.buy{opacity:.85}
.skin .none{width:44px;height:44px;display:grid;place-items:center;font-size:26px;color:var(--ink-soft)}
.boosts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.boosts .btn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.boosts .btn img{width:22px;height:22px}
.boosts .btn small{font-size:13px}
.boosts .btn.on{background:var(--mint);color:#fff}
.info img.big{width:96px;height:96px;margin:0 auto}
.info .req{font-size:18px}
.info .prog{height:12px;border:3px solid var(--edge);border-radius:6px;overflow:hidden;background:var(--bg)}
.info .prog i{display:block;height:100%;background:var(--gold)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-size:22px;min-width:2ch;text-align:center}
.stepper .btn{width:48px}
h3{margin:0 0 8px;font-size:18px}

/* game */
.hud span{white-space:nowrap}
.hud{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:600;min-height:40px}
.hud .grp{display:flex;align-items:center;gap:10px}
.hud .it{display:flex;align-items:center;gap:3px}
.hud img{width:18px;height:18px}
.hud .dragon img{width:22px;height:22px}
.hud .dragon.ready{color:var(--coral)}
.hud .hearts{display:flex;gap:2px}
.hud .menu{min-height:36px;padding:2px 10px;font-size:16px}
.stage{flex:none;display:flex;align-items:flex-start;justify-content:center}
.cw{position:relative;border:3px solid var(--edge);border-radius:6px;box-shadow:0 4px 0 var(--shadow);overflow:hidden;background:#1d1630}
.cw canvas{width:100%;height:100%;display:block;touch-action:manipulation}
#toasts{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{
  background:var(--card);color:var(--ink);border:3px solid var(--edge);border-radius:8px;padding:5px 10px;font-weight:600;font-size:15px;
  animation:pop 1.9s ease forwards;box-shadow:0 3px 0 var(--shadow);display:flex;gap:6px;align-items:center;max-width:92%;
}
.toast img{width:16px;height:16px}
@keyframes pop{0%{transform:scale(.6);opacity:0}10%{transform:scale(1.06);opacity:1}18%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){.toast{animation:fade 1.9s linear forwards}@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
/* fixed slots: message, question, answers. Hidden parts keep their space so nothing jumps */
#qbox[hidden],#timer[hidden]{display:block!important;visibility:hidden}
.msgrow{display:flex;align-items:center;gap:8px;height:44px;flex:none}
.msg{flex:1;margin:0;font-size:17px;line-height:1.2;max-height:2.4em;overflow:hidden}
.qbox{flex:none;background:var(--card);border:3px solid var(--edge);border-radius:10px;padding:6px 10px 8px;text-align:center;box-shadow:0 4px 0 var(--shadow)}
.qtext{font-size:42px;font-weight:600;height:50px;line-height:50px;white-space:nowrap}
.qtext.long{font-size:32px}
.qtext .slot{display:inline-block;min-width:1.2ch;color:var(--sky);border-bottom:4px solid currentColor;line-height:1}
.qtext.reveal .slot{color:var(--mint)}
.qtext.good .slot{color:var(--mint)}
.pips{display:flex;justify-content:center;gap:6px;height:14px;margin-bottom:2px}
.pips i{width:14px;height:14px;border:3px solid var(--edge);border-radius:3px;background:transparent}
.pips i.on{background:var(--coral)}
.timer{height:10px;border:3px solid var(--edge);border-radius:6px;overflow:hidden;margin-top:4px;background:var(--bg)}
.timer i{display:block;height:100%;width:100%;background:var(--gold)}
.timer.low i{background:var(--coral)}
.answers{flex:1;min-height:0;display:grid;gap:8px;align-content:end}
.answers.choices{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(56px,88px)}
.answers.choices .btn{font-size:34px;font-weight:600;min-height:0}
.answers.choices.n3 .btn:last-child{grid-column:1 / -1}
.answers.keypad{grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(38px,64px)}
.answers.keypad .btn{font-size:28px;font-weight:500;min-height:0;padding:4px}
.answers.doors{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.answers.doors{grid-auto-rows:minmax(56px,88px)}
.answers.doors .btn{font-size:18px;min-height:0}
.answers.off{pointer-events:none}
.answers.coach-wrap{align-content:space-between}
.coach{display:flex;gap:10px;align-items:flex-start}
.coach img{width:44px;height:44px;flex:none}
.coach p{margin:0;font-size:18px;line-height:1.3}
.coach b{display:block;font-size:14px;color:var(--ink-soft)}

/* stats */
#scr-stats{overflow-y:auto;padding-bottom:12px}
.stats-head{display:flex;align-items:center;gap:10px;margin-top:6px}
.stats-head h2{margin:0;font-size:26px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum b{display:block;font-size:26px;font-weight:600}
.sum span{font-size:14px;color:var(--ink-soft)}
.op{padding:8px 0;border-top:2px dashed color-mix(in srgb,var(--ink) 20%,transparent)}
.op:first-of-type{border-top:0}
.op-top{display:flex;align-items:center;gap:8px;font-size:17px}
.op-top span:first-child{flex:1}
.op-top b{font-size:18px}
.flag{font-size:12px;background:var(--coral);color:#fff;border-radius:5px;padding:2px 6px}
.bar{height:10px;border:2px solid var(--edge);border-radius:5px;overflow:hidden;background:var(--bg);margin:5px 0 3px}
.bar i{display:block;height:100%;background:var(--mint)}
.bar.mid i{background:var(--gold)}.bar.lowv i{background:var(--coral)}
.op small,.muted{font-size:14px;color:var(--ink-soft)}
.miss{display:flex;justify-content:space-between;font-size:20px;padding:4px 0}
.miss small{font-size:14px;color:var(--ink-soft);align-self:center}
.runl{display:flex;justify-content:space-between;font-size:16px;padding:3px 0}
.modal{position:fixed;inset:0;background:rgba(29,22,48,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;text-align:center}
.modal h2{margin:0;font-size:28px}
.modal p{margin:0;font-size:17px}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<div id="app">

  <!-- Hero select -->
  <section id="scr-title" class="screen">
    <h1 class="logo">Digit<br>Dungeon</h1>
    <p class="tag" data-i18n="tag"></p>
    <div class="lang" id="langSeg">
      <button class="btn" data-lang="en">English</button>
      <button class="btn" data-lang="fr">Français</button>
    </div>
    <div id="heroList" class="hero-list"></div>
    <button id="btnNew" class="btn gold" data-i18n="newHero"></button>
    <div id="newForm" class="card" hidden>
      <label for="nameIn" data-i18n="heroName"></label>
      <input id="nameIn" type="text" maxlength="12" autocomplete="off" placeholder="Lou">
      <p class="label" data-i18n="whereStart"></p>
      <div class="seg" id="startSeg">
        <button class="btn on" data-r="1"><span data-i18n="s1"></span><small data-i18n="s1d"></small></button>
        <button class="btn" data-r="4"><span data-i18n="s2"></span><small data-i18n="s2d"></small></button>
        <button class="btn" data-r="7"><span data-i18n="s3"></span><small data-i18n="s3d"></small></button>
      </div>
      <div class="row">
        <button id="btnCancel" class="btn" data-i18n="cancel"></button>
        <button id="btnCreate" class="btn primary" data-i18n="create"></button>
      </div>
    </div>
  </section>

  <!-- Hero lobby -->
  <section id="scr-lobby" class="screen" hidden>
    <div class="lobby-top">
      <img id="lobbyHero" class="px" alt="">
      <img id="lobbyPet" class="px" alt="" hidden>
      <div>
        <h2 id="lobbyName"></h2>
        <div id="lobbyLvl"></div>
        <div id="lobbyLvlDesc" class="muted"></div>
        <div class="wallet"><img id="walletIco" class="px" alt=""><b id="wallet">0</b><span data-i18n="walletLbl"></span></div>
      </div>
    </div>
    <button id="btnPlay" class="btn primary" style="font-size:22px;min-height:60px" data-i18n="enter"></button>
    <div class="tabs" id="lobbyTabs" role="tablist">
      <button class="btn tab" role="tab" data-tab="skin"><img id="tabSkin" class="px" alt=""><span data-i18n="tabSkins"></span></button>
      <button class="btn tab" role="tab" data-tab="pet"><img id="tabPet" class="px" alt=""><span data-i18n="pets"></span></button>
      <button class="btn tab" role="tab" data-tab="boost"><img id="tabBoost" class="px" alt=""><span data-i18n="tabBoosts"></span></button>
      <button class="btn tab" role="tab" data-tab="more"><span class="dots" aria-hidden="true">•••</span><span data-i18n="tabMore"></span></button>
    </div>
    <div class="panes" id="panes">
      <div class="pane" data-pane="skin" role="tabpanel">
        <div class="card">
          <div id="wardrobe" class="wardrobe"></div>
          <p style="margin:10px 0 0;font-size:14px;color:var(--ink-soft)" data-i18n="wardNote"></p>
        </div>
      </div>
      <div class="pane" data-pane="pet" role="tabpanel" hidden>
        <div class="card">
          <div id="petShop" class="wardrobe"></div>
          <p style="margin:10px 0 0;font-size:14px;color:var(--ink-soft)" data-i18n="petNote"></p>
        </div>
      </div>
      <div class="pane" data-pane="boost" role="tabpanel" hidden>
        <div class="card">
          <h3 data-i18n="boosts"></h3>
          <div id="boosts" class="boosts"></div>
          <p style="margin:10px 0 0;font-size:14px;color:var(--ink-soft)" data-i18n="boostNote"></p>
        </div>
      </div>
      <div class="pane" data-pane="more" role="tabpanel" hidden>
        <div class="card stats">
          <div><b id="stRoom">0</b><span data-i18n="bestRoom"></span></div>
          <div><b id="stStreak">0</b><span data-i18n="bestStreak"></span></div>
          <div><b id="stGold">0</b><span data-i18n="goldFound"></span></div>
        </div>
        <div class="card">
          <h3 data-i18n="lvTitle"></h3>
          <div class="stepper">
            <button id="lvDown" class="btn" aria-label="Easier">−</button>
            <b id="lvVal" style="font-family:var(--read)">1</b>
            <button id="lvUp" class="btn" aria-label="Harder">+</button>
            <span id="lvDesc" style="font-size:14px;color:var(--ink-soft);flex:1"></span>
          </div>
        </div>
        <button id="btnStats" class="btn" data-i18n="statsBtn"></button>
        <button id="btnSwitch" class="btn ghost" data-i18n="switchHero"></button>
      </div>
    </div>
  </section>

  <!-- Stats -->
  <section id="scr-stats" class="screen" hidden>
    <div class="stats-head"><button id="btnStatsBack" class="btn small" data-i18n="back"></button><h2 id="statsTitle"></h2></div>
    <div id="statsBody" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <!-- Game -->
  <section id="scr-game" class="screen" hidden>
    <div class="hud">
      <div class="grp">
        <div class="hearts" id="hudHearts"></div>
        <div class="it"><img class="px" id="icoPotion" alt="Potions"><span id="hudPotion">0</span></div>
        <div class="it"><img class="px" id="icoCoin" alt="Gold"><span id="hudGold">0</span></div>
      </div>
      <div class="grp">
        <div class="it"><img class="px" id="icoFlame" alt="Streak"><span id="hudStreak">0</span></div>
        <span id="hudRoom" class="it dragon"></span>
        <button class="btn menu" id="btnMenu" aria-label="Pause">II</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="cw" id="cw">
        <canvas id="cv" width="128" height="128"></canvas>
        <div id="toasts" aria-live="polite"></div>
      </div>
    </div>
    <div class="panel">
      <div class="msgrow"><p id="msg" class="msg"></p><span id="msgAside"></span></div>
      <div id="qbox" class="qbox" hidden>
        <div id="pips" class="pips"></div>
        <div id="qtext" class="qtext"></div>
        <div id="timer" class="timer"><i id="timerFill"></i></div>
      </div>
      <div id="answers" class="answers"></div>
    </div>
  </section>
</div>

<div id="modal" class="modal" hidden><div class="card" id="modalCard"></div></div>

<script>
"use strict";
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

function drawSprite(c, spr, pal, cx, cy, s, tint) {
  const h = spr.length, w = spr[0].length;
  const ox = Math.round(cx - w * s / 2), oy = Math.round(cy - h * s / 2);
  for (let j = 0; j < h; j++) {
    const row = spr[j];
    for (let i = 0; i < w; i++) {
      const ch = row[i];
      if (ch === '.') continue;
      c.fillStyle = tint || pal[ch] || '#f0f';
      c.fillRect(ox + i * s, oy + j * s, s, s);
    }
  }
}
function drawOutlined(c, spr, pal, cx, cy, s, tint, ow) {
  ow = ow || 1;
  for (const [dx, dy] of [[-ow, 0], [ow, 0], [0, -ow], [0, ow]]) drawSprite(c, spr, pal, cx + dx, cy + dy, s, '#2b2240');
  drawSprite(c, spr, pal, cx, cy, s, tint);
}
function spriteURL(spr, pal, s) {
  const ow = Math.max(1, Math.round(s / 2));
  const w = spr[0].length * s + ow * 2, h = spr.length * s + ow * 2;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  drawOutlined(cv.getContext('2d'), spr, pal, w / 2, h / 2, s, null, ow);
  return cv.toDataURL();
}

// Levels: choices early, typed answers from the full tables. No timer until level 7, then it gets shorter (+5 s for typed answers).
const LV = {
  1: { mode: 'choice', n: 3, timer: 0, free: true },
  2: { mode: 'choice', n: 3, timer: 0, free: true },
  3: { mode: 'choice', n: 3, timer: 0, free: true },
  4: { mode: 'choice', n: 3, timer: 0, free: true },
  5: { mode: 'choice', n: 4, timer: 0, free: false },
  6: { mode: 'choice', n: 4, timer: 0, free: false },
  7: { mode: 'input', n: 0, timer: 20, free: false },
  8: { mode: 'input', n: 0, timer: 10, free: false },
  9: { mode: 'input', n: 0, timer: 10, free: false },
  10: { mode: 'input', n: 0, timer: 5, free: false },
};
// right answers in a row needed before the dragon shows up, and right answers in a row to beat it
const bossAfter = lv => lv <= 4 ? 3 : 5;
const bossNeed = lv => lv <= 4 ? 2 : 3;
function gen(lv) {
  // a 0 (in the puzzle or as the answer) shows up in about 1 puzzle in 20, so it doesn't crowd the facts worth practising
  const zero = () => Math.random() < .05;
  const sw = (x, y) => Math.random() < .5 ? [x, y] : [y, x];
  const add = (lo, hi) => { const sum = rnd(Math.max(2, lo), hi), x = sum <= 10 && zero() ? pick([0, sum]) : rnd(Math.max(1, sum - 10), Math.min(9, sum - 1)); return [`${x} + ${sum - x} = ?`, sum]; };
  const sub = () => { const x = rnd(2, 10), y = zero() ? pick([0, x]) : rnd(1, x - 1); return [`${x} − ${y} = ?`, x - y]; };
  const mul = (a, b) => { let x = rnd(1, a), y = rnd(1, b); if (zero()) { if (Math.random() < .5) x = 0; else y = 0; } [x, y] = sw(x, y); return [`${x} × ${y} = ?`, x * y]; };
  const div = hi => { const b = rnd(2, hi), q = rnd(1, 10); return [`${b * q} ÷ ${b} = ?`, q]; };
  let r;
  switch (lv) {
    case 1: r = add(1, 10); break;
    case 2: r = add(8, 15); break;
    case 3: r = add(10, 20); break;
    case 4: r = sub(); break;
    case 5: r = mul(5, 5); break;
    case 6: r = mul(5, 10); break;
    case 7: r = mul(10, 10); break;
    case 8: r = div(5); break;
    case 9: r = div(10); break;
    default: r = pick([() => add(10, 20), sub, () => mul(10, 10), () => div(10)])();
  }
  const p = Object.assign({ text: r[0], answer: r[1] }, LV[lv] || LV[10]);
  if (p.timer && p.mode === 'input') p.timer += 5; // typing takes longer than tapping a choice
  if (p.mode === 'choice') p.opts = makeChoices(p);
  return p;
}
function makeChoices(p) {
  const a = p.answer, set = new Set([a]);
  let near = shuffle([a + 1, a - 1, a + 2, a - 2, a + 3]);
  const m = p.text.match(/^(\d+) × (\d+)/);
  // for times, the classic slips are a neighbour in the table or adding instead of multiplying
  if (m) { const x = +m[1], y = +m[2]; near = shuffle([x * (y + 1), x * (y - 1), (x + 1) * y, (x - 1) * y, x + y]).concat(near); }
  const far = a >= 10 ? shuffle([a + 10, a - 10]) : [];
  for (const v of near.concat(far)) { if (set.size >= p.n) break; if (v >= 0) set.add(v); }
  let k = 4; while (set.size < p.n) set.add(a + k++);
  return [...set].sort((x, y) => x - y);
}

const tipFor = lv => { const band = lv <= 4 ? 'low' : lv <= 7 ? 'mid' : 'high'; return { band, i: rnd(0, I18N.en.tips[band].length - 1) }; };

/* ================= sound ================= */
let AC = null;
function sfx(type) {
  if (!store.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const seq = { good: [660, 880], bad: [260, 180], coin: [988, 1319], door: [392, 523], win: [523, 659, 784, 1047], tap: [520] }[type] || [440];
    seq.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'square'; o.frequency.value = f;
      const st = AC.currentTime + i * 0.08;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.06, st + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.12);
      o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st + 0.14);
    });
  } catch (e) { }
}

function migrate(p) {
  if (p.wallet == null) p.wallet = p.gold || 0;
  if (!Array.isArray(p.pets)) p.pets = [];
  if (p.pet == null) p.pet = -1;
  if (p.dragons == null) p.dragons = 0;
  if (p.solved == null) p.solved = (p.stats && p.stats.ok) || 0;
  if (!p.boosts) p.boosts = { heart: false, potion: false };
  if (!p.opOk) p.opOk = {};
  if (p.maxLv == null) p.maxLv = clamp(Math.floor(p.rating), 1, 10);
  if (p.bestFloor == null) p.bestFloor = 0;
  if (!Array.isArray(p.clears)) p.clears = [];
  if (!p.bestAt) p.bestAt = {};
  if (!p.fresh) p.fresh = { skin: [], pet: [] };
  p.rating = clamp(Math.floor(p.rating), 1, 10);
  return p;
}
const progressOf = (k, o, m) => k === 'streak' && m > 1 ? (P.bestAt[m] || 0) : k === 'clear' ? (P.clears.includes(o) ? 1 : 0) : k === 'op' ? (P.opOk[o] || 0) : ({ streak: P.bestStreak, room: P.bestRoom, dragons: P.dragons, solved: P.solved, level: P.maxLv, floor: P.bestFloor })[k] || 0;
const greyPal = pal => Object.fromEntries(Object.keys(pal).map(k => [k, '#6a5a86']));
function checkAchievements() {
  SKINS.forEach((s, i) => {
    if (s.req && !P.unlocked.includes(i) && progressOf(s.req[0], s.req[2], s.req[3]) >= s.req[1]) { P.unlocked.push(i); P.fresh.skin.push(i); toast(t('newOutfit', t('skins')[i]), 'flame'); sfx('win'); }
  });
  PETS.forEach((p, i) => {
    if (p.req && !P.pets.includes(i) && progressOf(p.req[0], p.req[2], p.req[3]) >= p.req[1]) { P.pets.push(i); P.fresh.pet.push(i); toast(t('newPet', t('petNames')[i]), 'flame'); sfx('win'); }
  });
  save();
}

/* ================= run flow ================= */
function later(fn, ms) { const run = R; setTimeout(() => { if (R === run && !run.over) fn(); }, ms); }

function startRun() {
  migrate(P);
  R = { hp: 3 + (P.boosts.heart ? 1 : 0), maxHp: 5, potions: Math.min(1 + (P.boosts.potion ? 1 : 0), potionCap()), gold: 0, floor: 1, streak: 0, streakAt: {}, toBoss: 0, bossNext: false, depth: 0, solved: 0, n: 0, ok: 0, room: null, phase: 'idle', q: null, over: false };
  P.boosts = { heart: false, potion: false }; P.fresh = { skin: [], pet: [] }; seenLevel(); save();
  pet.x = 46; pet.y = 140;
  show('scr-game'); fit(); nextRoom();
}
function makeRoom(depth) {
  const lv = runLevel();
  let type;
  if (R.bossNext) { type = 'boss'; R.bossNext = false; R.toBoss = 0; }
  else if (depth === 1) type = 'monster';
  else {
    const r = Math.random();
    type = r < .4 ? 'monster' : r < .62 ? 'chest' : (r < .76 && R.room && R.room.type !== 'coach') ? 'coach' : 'empty';
  }
  const sides = pick([['left', 'top', 'right'], ['left', 'top'], ['top', 'right'], ['left', 'right'], ['left', 'top', 'right']]);
  const locked = type === 'empty' ? true : type === 'coach' || depth === 1 ? false : Math.random() < .4;
  const room = { type, locked, doors: sides.map(s => ({ side: s, open: !locked, p: null })), enc: null };
  const pool = lv <= 4 ? ['slime', 'bat'] : lv <= 7 ? ['slime', 'bat', 'goblin'] : ['bat', 'goblin'];
  if (type === 'monster') room.enc = { kind: 'monster', sprite: pick(pool), need: 1, progress: 0, alive: true };
  if (type === 'boss') room.enc = { kind: 'boss', need: bossNeed(lv), progress: 0, alive: true };
  if (type === 'chest') { const golden = lv >= 3 && Math.random() < .3; room.enc = { kind: 'chest', golden, need: golden ? 2 : 1, progress: 0, opened: false }; }
  if (type === 'coach') room.enc = { kind: 'coach', tip: tipFor(lv) };

}
function nextRoom() {

  buildBg(R.room.type === 'boss' ? BOSS_THEME : THEMES[(R.depth - 1) % THEMES.length], R.depth * 7919 + 13);
  fx.fadeOut = 0; fx.fadeIn = now();
  tw.x = tw.fx = tw.tx = 64; tw.y = tw.fy = 134; moveTo(HOME.x, HOME.y, 550);
  hud(); $('#qbox').hidden = true; aside(null); setAnswers('', []); say('');
  later(afterEnter, 600);
}
function afterEnter() {

  else if (e.kind === 'boss') { say(t('bossIntro', e.need)); ask({ kind: 'enc' }); }
  else if (e.kind === 'chest') { say(e.golden ? t('goldChest', e.need) : t('chest')); ask({ kind: 'enc' }); }

/* ================= questions ================= */
function ask(ctx) {

  else p = gen(runLevel());
  // from level 3 the dragon wants typed answers (levels 7+ are typed everywhere)
  if (ctx.kind === 'enc' && R.room.type === 'boss' && runLevel() >= 3 && p.mode === 'choice') { p.mode = 'input'; delete p.opts; }
  R.phase = 'question';
  R.q = { p, ctx, t0: now(), wrongs: 0, typed: '', done: false };

}
function renderQ(state) {

  const e = R.room.enc, pips = $('#pips'); pips.replaceChildren();

  if (state) return;
  if (p.mode === 'choice') {
    setAnswers('choices n' + p.opts.length, p.opts.map(v => { const b = btn(String(v), 'num', () => submit(v, b)); return b; }));
  } else {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'OK'];
    setAnswers('keypad', keys.map(k => btn(k, k === 'OK' ? 'primary num' : 'num', () => key(k))));
  }
  if (q.ctx.kind === 'door' && R.room.doors.filter(d => !d.open).length > 1) aside(btn(t('otherDoor'), 'small', () => { sfx('tap'); showDoors(); }));
  else if (q.ctx.kind === 'enc' && e.kind === 'chest') aside(btn(t('leaveIt'), 'small', () => { sfx('tap'); showDoors(); }));

function key(k) {

  else if (q.typed.length < 4) q.typed = (q.typed === '0' ? '' : q.typed) + k;

function submit(v, b) {

  else wrong(b, false);

function right(dt) {
  const q = R.q; q.done = true; sfx('good');
  if (!q.wrongs) record(q, true, dt);
  R.streak++; R.solved++; P.solved++;
  if (!(q.ctx.kind === 'enc' && R.room.type === 'boss') && !R.bossNext && ++R.toBoss >= bossAfter(runLevel())) { R.bossNext = true; later(() => toast(t('dragonNear'), 'dragon'), 700); }
  { const c = catOf(q.p.text); P.opOk[c] = (P.opOk[c] || 0) + 1; }
  if (R.streak > P.bestStreak) P.bestStreak = R.streak;
  for (const m of STREAK_LEVELS) { R.streakAt[m] = runLevel() >= m ? (R.streakAt[m] || 0) + 1 : 0; P.bestAt[m] = Math.max(P.bestAt[m] || 0, R.streakAt[m]); }
  if (dt < 2 && !q.wrongs && q.ctx.kind !== 'door') { if (R.potions < potionCap()) { R.potions++; toast(t('fast'), 'potion'); } }
  if (R.streak >= 5 && R.streak % 5 === 0) toast(t('streak', R.streak), 'flame');
  checkAchievements();
  save(); hud();
  renderQ('good'); $('#answers').classList.add('off');
  say(pick(t('praise')));
  later(() => resolveRight(q.ctx), 600);
}
function resolveRight(ctx) {
  const tn = now();
  if (ctx.kind === 'door') {
    ctx.door.open = true; ctx.door.p = null;
    const r = DOOR[ctx.door.side]; burst(r.x + r.w / 2, r.y + r.h / 2, ['#ffc83d', '#fff3a6'], 12);
    return walkThrough(ctx.door);
  }
  const e = R.room.enc;
  e.progress++;
  if (e.kind === 'monster' || e.kind === 'boss') {
    fx.heroLunge = tn; later(() => { fx.encHit = now(); }, 120);
    if (e.progress >= e.need) {
      later(() => {
        e.alive = false; fx.shake = now();
        burst(ENC.x, ENC.y, [e.kind === 'boss' ? '#ff7a45' : MONSTERS[e.sprite].col, '#ffffff'], 26);
        const g = (e.kind === 'boss' ? 5 : 1) * R.floor; R.gold += g;
        if (e.kind === 'boss') { P.dragons++; if (!P.clears.includes(runLevel())) { P.clears.push(runLevel()); later(() => toast(t('cleared', runLevel()), 'flame'), 300); } later(checkAchievements, 900); if (R.hp < R.maxHp) R.hp++; if (R.potions < potionCap()) { R.potions++; later(() => toast(t('potion'), 'potion'), 500); } toast(t('dragonBeaten', g), 'coin'); sfx('win'); }
        else { toast(t('gold', g), 'coin'); sfx('coin'); }
        save(); hud();
        say(e.kind === 'boss' ? t('emberGone') : t('poof'));
      }, 260);
      later(e.kind === 'boss' ? floorCleared : showDoors, 1300);
    } else {
      say(t('hitMore', e.need - e.progress));
      later(() => ask(ctx), 500);
    }
  } else if (e.kind === 'chest') {
    if (e.progress >= e.need) {
      e.opened = true; sfx('coin');
      burst(ENC.x, ENC.y - 6, ['#ffc83d', '#fff3a6', '#ffffff'], 22, true);
      if (R.potions < potionCap() && Math.random() < (e.golden ? .5 : .35)) { R.potions++; toast(t('potion'), 'potion'); }
      else { const g = (e.golden ? rnd(5, 8) : rnd(2, 4)) * R.floor; R.gold += g; toast(t('gold', g), 'coin'); }
      save(); hud(); say(t('chestOpen'));
      later(showDoors, 1100);
    } else {
      say(t('clickMore', e.need - e.progress));
      later(() => ask(ctx), 500);
    }
  }
}
function wrong(b, timeout) {
  const q = R.q; if (!q || q.done) return;
  if (!q.wrongs) record(q, false, 0);
  // any mistake restarts the streak, so the dragon comes later
  R.streak = 0; R.streakAt = {}; R.toBoss = 0; R.bossNext = false; sfx('bad');
  const e = R.room.enc, isEnc = q.ctx.kind === 'enc';
  const freeTry = false; // potions are the only free tries against monsters, bosses and chests
  const isDoor = q.ctx.kind === 'door';
  const doorFree = isDoor && q.p.free && !timeout;
  const usePotion = !isDoor && R.potions > 0;
  q.wrongs++;
  if (isEnc && e.need > 1) e.progress = 0;
  hud();
  if (freeTry || doorFree || usePotion) {
    if (!freeTry && !doorFree) { R.potions--; hud(); toast(t('potionUsed'), 'potion'); }
    if (b) b.classList.add('nope');
    if (q.p.mode === 'input') { q.typed = ''; const s = $('#qtext .slot'); if (s) s.textContent = '?'; }
    if (timeout) q.t0 = now();
    fx.wiggle = now();
    $('#qtext').classList.add('shake'); setTimeout(() => $('#qtext').classList.remove('shake'), 300);
    say(freeTry ? t('freeTry') : timeout ? t('potionTime') : t('tryAgain'));
    if (isEnc && e.need > 1) renderPips();
    save(); return;
  }
  // penalty
  q.done = true;
  R.hp--; fx.heroHurt = now(); fx.shake = now();
  if (isEnc && (e.kind === 'monster' || e.kind === 'boss')) fx.encLunge = now(); else fx.wiggle = now();
  hud(); save();
  renderQ('reveal'); $('#answers').classList.add('off');
  say(t('answerWas', q.p.answer, timeout));
  if (q.ctx.kind === 'door') q.ctx.door.p = null;
  if (R.hp <= 0) { later(gameOver, 1400); return; }
  later(() => ask(q.ctx), 1700);
}
function renderPips() {
  const e = R.room.enc, pips = $('#pips'); pips.replaceChildren();
  for (let i = 0; i < e.need; i++) pips.appendChild(el('i', i < e.progress ? 'on' : ''));
}

/* ================= per-kid stats ================= */
function stats(p) {
  if (!p.stats) p.stats = { total: 0, ok: 0, ops: {}, missed: {}, runs: [], maxLv: clamp(Math.floor(p.rating), 1, 10) };
  return p.stats;
}
function catOf(text) {
  if ((text.match(/[+−×÷]/g) || []).length > 1 || text.includes('(')) return 'mix';
  if (!text.endsWith('= ?')) return 'miss';
  return text.includes('+') ? 'add' : text.includes('−') ? 'sub' : text.includes('×') ? 'mul' : 'div';
}
function record(q, ok, dt) {
  const s = stats(P), c = catOf(q.p.text);
  const o = s.ops[c] || (s.ops[c] = { n: 0, ok: 0, t: 0 });
  o.n++; s.total++; R.n++;
  if (ok) { o.ok++; o.t += Math.min(dt, 60); s.ok++; R.ok++; }
  else {
    const k = q.p.text.replace('?', q.p.answer);
    s.missed[k] = (s.missed[k] || 0) + 1;
    const keys = Object.keys(s.missed);
    if (keys.length > 40) { keys.sort((a, b) => s.missed[a] - s.missed[b]); delete s.missed[keys[0]]; }
  }
}
function endRun() {
  if (!R || R.logged) return;
  R.logged = true;
  if (!R.n) return;
  const s = stats(P);
  s.runs.unshift({ d: Date.now(), rooms: R.depth, n: R.n, ok: R.ok });
  s.runs = s.runs.slice(0, 10); save();
}
function renderStats() {
  const s = stats(P), body = $('#statsBody'), loc = store.lang === 'fr' ? 'fr-FR' : 'en-GB';
  $('#statsTitle').textContent = t('statsTitle', P.name);
  body.replaceChildren();
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const sum = el('div', 'card sum');
  for (const [v, k] of [[s.total, 'answered'], [s.total ? pct(s.ok, s.total) + (store.lang === 'fr' ? '\u202f%' : '%') : '–', 'firstTry'], [s.runs.length, 'runs'], [s.maxLv || level(), 'topLevel']]) {
    const d = el('div'); d.append(el('b', null, String(v)), el('span', null, t(k))); sum.appendChild(d);
  }
  body.appendChild(sum);
  if (!s.total) { body.appendChild(el('p', 'card muted', t('noStats'))); return; }
  // by operation
  const ops = el('div', 'card'); ops.appendChild(el('h3', null, t('byOp')));
  const list = ['add', 'sub', 'mul', 'div', 'miss', 'mix'].filter(c => s.ops[c] && s.ops[c].n);
  const scored = list.filter(c => s.ops[c].n >= 5).map(c => [c, s.ops[c].ok / s.ops[c].n]).sort((a, b) => a[1] - b[1]);
  const weakest = scored.length && scored[0][1] < .7 ? scored[0][0] : null;
  for (const c of list) {
    const o = s.ops[c], p = pct(o.ok, o.n);
    const row = el('div', 'op'), top = el('div', 'op-top');
    top.appendChild(el('span', null, tt('ops', c)));
    if (c === weakest) top.appendChild(el('span', 'flag', t('practise')));
    top.appendChild(el('b', null, p + (store.lang === 'fr' ? '\u202f%' : '%')));
    const bar = el('div', 'bar' + (p < 60 ? ' lowv' : p < 80 ? ' mid' : '')), fill = el('i'); fill.style.width = p + '%'; bar.appendChild(fill);
    const avg = o.ok ? (o.t / o.ok).toLocaleString(loc, { maximumFractionDigits: 1 }) : null;
    row.append(top, bar, el('small', null, t('opLine', o.n, avg)));
    ops.appendChild(row);
  }
  body.appendChild(ops);
  // trickiest
  const tr = el('div', 'card'); tr.appendChild(el('h3', null, t('tricky')));
  const missed = Object.entries(s.missed).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (!missed.length) tr.appendChild(el('p', 'muted', t('noMissed')));
  for (const [k, n] of missed) { const r = el('div', 'miss'); r.append(el('span', null, k), el('small', null, t('missed', n))); tr.appendChild(r); }
  body.appendChild(tr);
  // recent runs
  if (s.runs.length) {
    const rr = el('div', 'card'); rr.appendChild(el('h3', null, t('recent')));
    for (const r of s.runs) {
      const l = el('div', 'runl');
      l.append(el('span', 'muted', new Date(r.d).toLocaleDateString(loc, { day: 'numeric', month: 'short' })), el('span', null, t('runLine', r.rooms, pct(r.ok, r.n))));
      rr.appendChild(l);
    }
    body.appendChild(rr);
  }
  const reset = btn(t('resetStats'), 'ghost', () => {
    if (!reset.classList.contains('armed')) { reset.classList.add('armed'); reset.textContent = t('confirm'); setTimeout(() => { reset.classList.remove('armed'); reset.textContent = t('resetStats'); }, 2500); return; }
    delete P.stats; stats(P); save(); renderStats();
  });
  body.appendChild(reset);
}

/* ================= end & menu ================= */
function modal(nodes) { $('#modalCard').replaceChildren(...nodes); $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; $('#modalCard').classList.remove('info'); }
function seenLevel() { const st = stats(P); st.maxLv = Math.max(st.maxLv || 0, level()); P.maxLv = Math.max(P.maxLv || 0, level()); }
function bank(g) { P.wallet += g; P.gold += g; save(); }
const halfBag = () => Math.floor(R.gold / 2);
function floorCleared() {
  R.phase = 'floor'; P.bestFloor = Math.max(P.bestFloor || 0, R.floor); checkAchievements(); $('#qbox').hidden = true; setAnswers('', []); aside(null); say('');
  modal([
    el('h2', null, t('floorCleared', R.floor)),
    el('p', null, t('bag', R.gold)),
    el('p', null, t('stopOrMore')),
    ...(runLevel() < 10 ? [btn(t('goHarder', runLevel() + 1, t('lvDesc')[runLevel()]), 'primary', () => {
      closeModal(); R.floor++; P.rating = runLevel() + 1; R.potions = Math.min(R.potions, potionCap()); seenLevel(); save(); hud(); toast(t('floorStart', runLevel()), 'flame'); showDoors();
    })] : []),
    btn(t('goSame', runLevel()), '', () => { closeModal(); R.floor++; hud(); toast(t('floorSame', R.floor), 'flame'); showDoors(); }),
    btn(t('goHome', R.gold), 'gold', () => {
      closeModal(); const g = R.gold, r = R.depth; bank(g); endRun(); R.over = true; R = null; renderLobby(); show('scr-lobby');
      modal([el('h2', null, t('homeTitle')), el('p', null, t('homeBody', r, g)), btn(t('ok'), 'primary', closeModal)]);
    }),
  ]);
}
function gameOver() {
  const kept = halfBag(); bank(kept);
  endRun(); R.over = true; R.phase = 'over'; save();
  const im = el('img', 'px'); im.src = spriteURL(SPR.hero, heroPal(P.skin), 6); im.alt = ''; im.style.cssText = 'width:72px;height:72px;margin:0 auto';
  modal([
    im,
    el('h2', null, t('napTitle')),
    el('p', null, t('napBody', R.depth, R.solved, R.gold, kept)),
    btn(t('playAgain'), 'primary', () => { closeModal(); startRun(); }),
    btn(t('backHero'), '', () => { closeModal(); R = null; renderLobby(); show('scr-lobby'); }),
  ]);
}
function pause() {
  if (!R || R.over || !$('#modal').hidden) return;
  paused = true; pausedAt = now();
  modal([
    el('h2', null, t('paused')),
    btn(t('resume'), 'primary', resume),
    btn(t('sound', store.sound), '', function () { store.sound = !store.sound; save(); this.textContent = t('sound', store.sound); }),
    btn(t('leave', halfBag()), '', () => { closeModal(); paused = false; bank(halfBag()); endRun(); R.over = true; R = null; renderLobby(); show('scr-lobby'); }),
  ]);
}
function resume() {
  closeModal();
  if (paused && R && R.q) R.q.t0 += now() - pausedAt;
  paused = false;
}
$('#btnMenu').addEventListener('click', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* canvas taps on doors */
cv.addEventListener('click', ev => {
  if (!R || R.phase !== 'doors') return;
  const rc = cv.getBoundingClientRect();
  const x = (ev.clientX - rc.left) / rc.width * 128, y = (ev.clientY - rc.top) / rc.height * 128;
  for (const d of R.room.doors) {
    const r = DOOR[d.side];
    if (x >= r.x - 8 && x <= r.x + r.w + 8 && y >= r.y - 8 && y <= r.y + r.h + 8) return doorTap(d);
  }
});
/* keyboard support */
document.addEventListener('keydown', ev => {
  if (!R || !R.q || R.q.done || R.phase !== 'question' || paused) return;
  const p = R.q.p;
  if (p.mode === 'input') {
    if (/^[0-9]$/.test(ev.key)) key(ev.key);
    else if (ev.key === 'Backspace') key('⌫');
    else if (ev.key === 'Enter') key('OK');
  } else if (/^[1-4]$/.test(ev.key)) {
    const bs = document.querySelectorAll('#answers .btn'); const b = bs[+ev.key - 1]; if (b) b.click();
  }
});

/* ================= boot ================= */
ICON.heart = spriteURL(SPR.heart, PAL.heart, 3);
ICON.potion = spriteURL(SPR.potion, PAL.potion, 3);
ICON.coin = spriteURL(SPR.coin, PAL.coin, 3);
ICON.flame = spriteURL(SPR.flame, PAL.flame, 3);
ICON.dragon = spriteURL(SPR.dragon, PAL.dragon, 2);
$('#icoPotion').src = ICON.potion; $('#icoCoin').src = ICON.coin; $('#icoFlame').src = ICON.flame;
load();
applyLang();
renderTitle();
</script>
